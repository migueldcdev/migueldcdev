<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="AI agent workflow: 0 strong spec, 1 tests as a human-agent contract, 2 agentic team of developer, reviewer and security auditor, 3 PR with manual action checks, 4 human code review, 5 automated quality gates, 6 deploy to staging via CI, 7 human QA in staging, 8 deploy to production">
  <defs>
    <clipPath id="round"><rect width="1200" height="620" rx="24" ry="24"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1b1140"/>
      <stop offset="55%" stop-color="#0b0820"/>
      <stop offset="100%" stop-color="#03030b"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f86c9"/>
    </marker>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .4  0 0 0 0 1  0 0 0 .35 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .box { fill: #120d2b; stroke-width: 1.5; }
    .num { font-size: 15px; font-weight: 700; fill: #0b0820; text-anchor: middle; }
    .title { font-size: 20px; font-weight: 700; fill: #f3eeff; }
    .sub { font-size: 14px; fill: #b9b3d9; }
    .pill { font-size: 13px; font-weight: 600; fill: #e9e2ff; text-anchor: middle; }
    .legend { font-size: 14px; fill: #b9b3d9; }
    .flow { stroke: #8f86c9; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .foundation { stroke: #ffd98a; } .foundation-fill { fill: #ffd98a; }
    .agents { stroke: #a78bfa; } .agents-fill { fill: #a78bfa; }
    .human { stroke: #ff9ad5; } .human-fill { fill: #ff9ad5; }
    .auto { stroke: #7cc8ff; } .auto-fill { fill: #7cc8ff; }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="620" fill="url(#bg)"/>

    <!-- faint stars -->
    <g fill="#fff">
      <circle cx="40" cy="30" r="1" opacity=".5"/><circle cx="410" cy="18" r="1.2" opacity=".4"/>
      <circle cx="790" cy="200" r="1" opacity=".35"/><circle cx="1170" cy="40" r="1.3" opacity=".5"/>
      <circle cx="30" cy="390" r="1" opacity=".4"/><circle cx="1180" cy="380" r="1" opacity=".35"/>
      <circle cx="600" cy="560" r="1.2" opacity=".4"/><circle cx="1100" cy="590" r="1" opacity=".5"/>
      <circle cx="410" cy="200" r=".9" opacity=".3"/><circle cx="790" cy="380" r=".9" opacity=".3"/>
    </g>

    <!-- connectors (snake: row 1 →, down, row 2 ←, down, row 3 →) -->
    <path class="flow" d="M380 100 H436"/>
    <path class="flow" d="M760 100 H816"/>
    <path class="flow" d="M980 160 V216"/>
    <path class="flow" d="M820 280 H764"/>
    <path class="flow" d="M440 280 H384"/>
    <path class="flow" d="M220 340 V396"/>
    <path class="flow" d="M380 460 H436"/>
    <path class="flow" d="M760 460 H816"/>

    <!-- Row 1 -->
    <g>
      <rect class="box foundation" x="60" y="40" width="320" height="120" rx="16"/>
      <circle class="foundation-fill" cx="94" cy="76" r="16"/><text class="num" x="94" y="81">0</text>
      <text class="title" x="124" y="83">Strong spec</text>
      <text class="sub" x="86" y="128">What to build, and why</text>
    </g>
    <g>
      <rect class="box foundation" x="440" y="40" width="320" height="120" rx="16"/>
      <circle class="foundation-fill" cx="474" cy="76" r="16"/><text class="num" x="474" y="81">1</text>
      <text class="title" x="504" y="72" font-size="18"><tspan x="504">Tests as a</tspan><tspan x="504" dy="23">human-agent contract</tspan></text>
      <text class="sub" x="466" y="134">Unit · integration · end-to-end</text>
    </g>
    <g filter="url(#glow)">
      <rect class="box agents" x="820" y="40" width="320" height="120" rx="16"/>
      <circle class="agents-fill" cx="854" cy="76" r="16"/><text class="num" x="854" y="81">2</text>
      <text class="title" x="884" y="83">Agentic team</text>
      <rect x="840" y="108" width="96" height="28" rx="14" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".6"/>
      <text class="pill" x="888" y="127">Developer</text>
      <rect x="944" y="108" width="88" height="28" rx="14" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".6"/>
      <text class="pill" x="988" y="127">Reviewer</text>
      <rect x="1040" y="108" width="80" height="28" rx="14" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".6"/>
      <text class="pill" x="1080" y="127">Security</text>
    </g>

    <!-- Row 2 (right to left) -->
    <g>
      <rect class="box human" x="820" y="220" width="320" height="120" rx="16"/>
      <circle class="human-fill" cx="854" cy="256" r="16"/><text class="num" x="854" y="261">3</text>
      <text class="title" x="884" y="263">PR + manual checks</text>
      <text class="sub" x="846" y="308">Deliberate human action to proceed</text>
    </g>
    <g>
      <rect class="box human" x="440" y="220" width="320" height="120" rx="16"/>
      <circle class="human-fill" cx="474" cy="256" r="16"/><text class="num" x="474" y="261">4</text>
      <text class="title" x="504" y="263">Human code review</text>
      <text class="sub" x="466" y="308">Like a colleague's work, not a stamp</text>
    </g>
    <g>
      <rect class="box auto" x="60" y="220" width="320" height="120" rx="16"/>
      <circle class="auto-fill" cx="94" cy="256" r="16"/><text class="num" x="94" y="261">5</text>
      <text class="title" x="124" y="263">Quality gates</text>
      <text class="sub" x="86" y="308">Tests · lint · Prettier → merge to main</text>
    </g>

    <!-- Row 3 -->
    <g>
      <rect class="box auto" x="60" y="400" width="320" height="120" rx="16"/>
      <circle class="auto-fill" cx="94" cy="436" r="16"/><text class="num" x="94" y="441">6</text>
      <text class="title" x="124" y="443">Staging via CI</text>
      <text class="sub" x="86" y="488">Mirrors production</text>
    </g>
    <g>
      <rect class="box human" x="440" y="400" width="320" height="120" rx="16"/>
      <circle class="human-fill" cx="474" cy="436" r="16"/><text class="num" x="474" y="441">7</text>
      <text class="title" x="504" y="443">Human QA</text>
      <text class="sub" x="466" y="488">Catches what tests can't</text>
    </g>
    <g filter="url(#glow)">
      <rect class="box auto" x="820" y="400" width="320" height="120" rx="16" stroke-width="2.5"/>
      <circle class="auto-fill" cx="854" cy="436" r="16"/><text class="num" x="854" y="441">8</text>
      <text class="title" x="884" y="443">Production 🚀</text>
      <text class="sub" x="846" y="488">Only after QA signs off</text>
    </g>

    <!-- legend -->
    <g transform="translate(60 568)">
      <circle class="foundation-fill" cx="6" cy="0" r="6"/><text class="legend" x="20" y="5">Foundation</text>
      <circle class="agents-fill" cx="136" cy="0" r="6"/><text class="legend" x="150" y="5">AI agents</text>
      <circle class="human-fill" cx="256" cy="0" r="6"/><text class="legend" x="270" y="5">Human gate</text>
      <circle class="auto-fill" cx="386" cy="0" r="6"/><text class="legend" x="400" y="5">Automated</text>
    </g>
  </g>
</svg>
