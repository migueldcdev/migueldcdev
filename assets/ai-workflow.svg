<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="AI-native workflow: 0 strong spec, 1 scope it, 2 tests as the contract, 3 agentic team of developer, reviewer and security auditor, 4 pull request, 5 human code review, 6 automated quality gates, 7 deploy to staging via CI, 8 human QA in staging, 9 deploy to production, 10 measure in production, then close the loop back to the spec">
  <defs>
    <clipPath id="round"><rect width="1200" height="800" rx="24" ry="24"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1b1140"/>
      <stop offset="55%" stop-color="#0b0820"/>
      <stop offset="100%" stop-color="#03030b"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f86c9"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8ef0b5"/>
    </marker>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .4  0 0 0 0 1  0 0 0 .35 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .box { fill: #120d2b; stroke-width: 1.5; }
    .num { font-size: 15px; font-weight: 700; fill: #0b0820; text-anchor: middle; }
    .title { font-size: 20px; font-weight: 700; fill: #f3eeff; }
    .sub { font-size: 14px; fill: #b9b3d9; }
    .pill { font-size: 13px; font-weight: 600; fill: #e9e2ff; text-anchor: middle; }
    .legend { font-size: 14px; fill: #b9b3d9; }
    .flow { stroke: #8f86c9; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .loop { stroke: #8ef0b5; stroke-width: 2; fill: none; stroke-dasharray: 6 6; marker-end: url(#arrow-loop); }
    .foundation { stroke: #ffd98a; } .foundation-fill { fill: #ffd98a; }
    .agents { stroke: #a78bfa; } .agents-fill { fill: #a78bfa; }
    .human { stroke: #ff9ad5; } .human-fill { fill: #ff9ad5; }
    .auto { stroke: #7cc8ff; } .auto-fill { fill: #7cc8ff; }
    .learn { stroke: #8ef0b5; } .learn-fill { fill: #8ef0b5; }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="800" fill="url(#bg)"/>

    <!-- faint stars -->
    <g fill="#fff">
      <circle cx="40" cy="20" r="1" opacity=".5"/><circle cx="410" cy="18" r="1.2" opacity=".4"/>
      <circle cx="790" cy="200" r="1" opacity=".35"/><circle cx="1170" cy="40" r="1.3" opacity=".5"/>
      <circle cx="1180" cy="380" r="1" opacity=".35"/><circle cx="790" cy="560" r=".9" opacity=".3"/>
      <circle cx="600" cy="740" r="1.2" opacity=".4"/><circle cx="1100" cy="770" r="1" opacity=".5"/>
      <circle cx="410" cy="200" r=".9" opacity=".3"/><circle cx="790" cy="380" r=".9" opacity=".3"/>
    </g>

    <!-- connectors (snake: row 1 →, row 2 ←, row 3 →, row 4 ←) -->
    <path class="flow" d="M380 100 H436"/>
    <path class="flow" d="M760 100 H816"/>
    <path class="flow" d="M980 160 V216"/>
    <path class="flow" d="M820 280 H764"/>
    <path class="flow" d="M440 280 H384"/>
    <path class="flow" d="M220 340 V396"/>
    <path class="flow" d="M380 460 H436"/>
    <path class="flow" d="M760 460 H816"/>
    <path class="flow" d="M980 520 V576"/>
    <path class="flow" d="M820 640 H764"/>

    <!-- Kaizen loop: measure → close the loop → back to spec -->
    <path class="loop" d="M440 640 H384"/>
    <path class="loop" d="M60 640 H32 V100 H56"/>

    <!-- Row 1 -->
    <g>
      <rect class="box foundation" x="60" y="40" width="320" height="120" rx="16"/>
      <circle class="foundation-fill" cx="94" cy="76" r="16"/><text class="num" x="94" y="81">0</text>
      <text class="title" x="124" y="83">Strong spec</text>
      <text class="sub" x="86" y="128">What, why, and how we'll know</text>
    </g>
    <g>
      <rect class="box foundation" x="440" y="40" width="320" height="120" rx="16"/>
      <circle class="foundation-fill" cx="474" cy="76" r="16"/><text class="num" x="474" y="81">1</text>
      <text class="title" x="504" y="83">Scope it</text>
      <text class="sub" x="466" y="128">Small tasks · process scaled to risk</text>
    </g>
    <g>
      <rect class="box foundation" x="820" y="40" width="320" height="120" rx="16"/>
      <circle class="foundation-fill" cx="854" cy="76" r="16"/><text class="num" x="854" y="81">2</text>
      <text class="title" x="884" y="83">Tests as the contract</text>
      <text class="sub" x="846" y="128">Unit · integration · end-to-end</text>
    </g>

    <!-- Row 2 (right to left) -->
    <g filter="url(#glow)">
      <rect class="box agents" x="820" y="220" width="320" height="120" rx="16"/>
      <circle class="agents-fill" cx="854" cy="256" r="16"/><text class="num" x="854" y="261">3</text>
      <text class="title" x="884" y="263">Agentic team</text>
      <rect x="840" y="288" width="96" height="28" rx="14" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".6"/>
      <text class="pill" x="888" y="307">Developer</text>
      <rect x="944" y="288" width="88" height="28" rx="14" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".6"/>
      <text class="pill" x="988" y="307">Reviewer</text>
      <rect x="1040" y="288" width="80" height="28" rx="14" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".6"/>
      <text class="pill" x="1080" y="307">Security</text>
    </g>
    <g>
      <rect class="box human" x="440" y="220" width="320" height="120" rx="16"/>
      <circle class="human-fill" cx="474" cy="256" r="16"/><text class="num" x="474" y="261">4</text>
      <text class="title" x="504" y="263">Pull request</text>
      <text class="sub" x="466" y="308">Same process as human work</text>
    </g>
    <g>
      <rect class="box human" x="60" y="220" width="320" height="120" rx="16"/>
      <circle class="human-fill" cx="94" cy="256" r="16"/><text class="num" x="94" y="261">5</text>
      <text class="title" x="124" y="263">Human code review</text>
      <text class="sub" x="86" y="308">Like a colleague's work, not a stamp</text>
    </g>

    <!-- Row 3 -->
    <g>
      <rect class="box auto" x="60" y="400" width="320" height="120" rx="16"/>
      <circle class="auto-fill" cx="94" cy="436" r="16"/><text class="num" x="94" y="441">6</text>
      <text class="title" x="124" y="443">Quality gates</text>
      <text class="sub" x="86" y="488">Tests · lint · format → manual merge</text>
    </g>
    <g>
      <rect class="box auto" x="440" y="400" width="320" height="120" rx="16"/>
      <circle class="auto-fill" cx="474" cy="436" r="16"/><text class="num" x="474" y="441">7</text>
      <text class="title" x="504" y="443">Staging via CI</text>
      <text class="sub" x="466" y="488">Mirrors production</text>
    </g>
    <g>
      <rect class="box human" x="820" y="400" width="320" height="120" rx="16"/>
      <circle class="human-fill" cx="854" cy="436" r="16"/><text class="num" x="854" y="441">8</text>
      <text class="title" x="884" y="443">Human QA</text>
      <text class="sub" x="846" y="488">Catches what tests can't</text>
    </g>

    <!-- Row 4 (right to left) -->
    <g filter="url(#glow)">
      <rect class="box auto" x="820" y="580" width="320" height="120" rx="16" stroke-width="2.5"/>
      <circle class="auto-fill" cx="854" cy="616" r="16"/><text class="num" x="854" y="621">9</text>
      <text class="title" x="884" y="623">Production</text>
      <text class="sub" x="846" y="668">After QA sign-off · feature flags</text>
    </g>
    <g>
      <rect class="box learn" x="440" y="580" width="320" height="120" rx="16"/>
      <circle class="learn-fill" cx="474" cy="616" r="16"/><text class="num" x="474" y="621">10</text>
      <text class="title" x="504" y="623">Measure impact</text>
      <text class="sub" x="466" y="668">Success metric · errors · usage</text>
    </g>
    <g>
      <rect class="box learn" x="60" y="580" width="320" height="120" rx="16" stroke-dasharray="6 6"/>
      <text class="title" x="86" y="623">Close the loop ↺</text>
      <text class="sub" x="86" y="668">Learnings → spec, tests, agents</text>
    </g>

    <!-- legend -->
    <g transform="translate(60 748)">
      <circle class="foundation-fill" cx="6" cy="0" r="6"/><text class="legend" x="20" y="5">Foundation</text>
      <circle class="agents-fill" cx="136" cy="0" r="6"/><text class="legend" x="150" y="5">AI agents</text>
      <circle class="human-fill" cx="256" cy="0" r="6"/><text class="legend" x="270" y="5">Human gate</text>
      <circle class="auto-fill" cx="386" cy="0" r="6"/><text class="legend" x="400" y="5">Automated</text>
      <circle class="learn-fill" cx="506" cy="0" r="6"/><text class="legend" x="520" y="5">Learn &amp; improve</text>
    </g>
  </g>
</svg>
